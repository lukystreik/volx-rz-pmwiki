# nginx hinter einem Reverse-Proxy (HAProxy, Traefik, ...): echte Client-IP aus X-Forwarded-For uebernehmen.
# Vertraut wird nur den privaten Netzen, die in Docker/k8s-Umgebungen fuer den Proxy genutzt werden.
# Liegt der Proxy ausserhalb dieser Netze, hier zusaetzlich einbinden - sonst wird der Header ignoriert.
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
real_ip_header    X-Forwarded-For;
# bei mehreren Proxies in der Kette die letzte nicht vertrauenswuerdige Adresse nehmen
real_ip_recursive on;
